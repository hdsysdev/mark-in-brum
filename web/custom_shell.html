<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='en' xml:lang='en'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover' />
	<meta name='mobile-web-app-capable' content='yes' />
	<meta name='apple-mobile-web-app-capable' content='yes' />
	<meta name='theme-color' content='#0d0f14' />
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		:root {
			--sat: env(safe-area-inset-top, 0px);
			--sar: env(safe-area-inset-right, 0px);
			--sab: env(safe-area-inset-bottom, 0px);
			--sal: env(safe-area-inset-left, 0px);
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%;
			height: 100%;
			height: 100dvh;
			background: #0d0f14;
			overflow: hidden;
			overscroll-behavior: none;
			touch-action: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-user-select: none;
			user-select: none;
			position: fixed;
			inset: 0;
		}
		#game {
			position: absolute;
			inset: 0;
			padding:
				calc(env(safe-area-inset-top, 0px))
				calc(env(safe-area-inset-right, 0px))
				calc(env(safe-area-inset-bottom, 0px))
				calc(env(safe-area-inset-left, 0px));
		}
		canvas {
			display: block;
			width: 100%;
			height: 100%;
			outline: none;
		}
		#status {
			position: absolute;
			left: 0;
			bottom: 0;
			width: 100%;
			height: 5px;
			background: rgba(255, 255, 255, 0.08);
		}
		#status-progress {
			position: relative;
			height: 100%;
			width: 0%;
			background: #e8b84a;
			transition: width 0.2s ease-out;
		}
		#status-notice {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 14px;
			text-align: center;
			font-family: system-ui, -apple-system, sans-serif;
			font-size: 13px;
			color: #8f93a2;
			padding: 0 24px;
		}
		#status-indeterminate {
			display: none;
		}
		@keyframes pulse {
			0% { opacity: 0.4; }
			50% { opacity: 1; }
			100% { opacity: 0.4; }
		}
		#status.progress #status-progress { animation: pulse 1.2s infinite; }
	</style>
</head>
<body>
	<div id='game'>
		<canvas id='canvas'></canvas>
	</div>
	<div id='status'>
		<div id='status-progress'></div>
		<div id='status-indeterminate'><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
		<div id='status-notice'></div>
	</div>
	<script src='$GODOT_URL'></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"$GODOT_NAME","experimentalVK":false,"fileSizes":$GODOT_FILE_SIZES,"focusCanvas":true,"gdnativeLibs":[]};
		const engine = new Engine(GODOT_CONFIG);
		const statusElement = document.getElementById('status');
		const statusNotice = document.getElementById('status-notice');
		const statusProgress = document.getElementById('status-progress');

		(function () {
			// Hook console messages into window.__markInBrum.errors for the QA bridge.
			window.__markInBrum = { ready: false, errors: [] };
			const originalConsoleError = console.error.bind(console);
			console.error = function (...args) {
				window.__markInBrum.errors.push(args.map(String).join(' '));
				originalConsoleError(...args);
			};
		})();

		engine.startGame({
			'onExit': function () {
				statusNotice.textContent = 'Game stopped.';
			},
			'onPrint': function () { /* ignore stdout */ },
			'onPrintError': function (var_args) {
				console.error('[Godot]', Array.from(arguments).join(' '));
			}
		}).then(function () {
			statusElement.style.display = 'none';
			document.body.classList.add('loaded');
		});
	</script>
</body>
</html>
